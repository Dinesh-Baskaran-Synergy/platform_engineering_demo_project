[project]
name = "acme-evals"
version = "0.1.0"
description = "AcmeCloud Support Assistant: a worked example of building evals for an LLM app (LiteLLM-only)."
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50.0",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:pydantic.*", "ignore::DeprecationWarning"]
